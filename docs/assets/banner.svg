<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="EnvelopeSeal banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100e1d"/>
      <stop offset="1" stop-color="#171430"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7f6cf0"/>
      <stop offset="1" stop-color="#5b48d8"/>
    </linearGradient>
  </defs>
  <rect width="960" height="260" fill="url(#bg)"/>
  <g stroke="#211d3d" stroke-width="1">
    <path d="M0 65 H960 M0 130 H960 M0 195 H960 M240 0 V260 M480 0 V260 M720 0 V260"/>
  </g>
  <text x="48" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#f4f2ff">EnvelopeSeal</text>
  <text x="48" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#a99fd8">wrap graph integrity, strength ordering, rotation and blast radius, offline</text>
  <g transform="translate(48 152)">
    <rect x="0" y="0" width="250" height="72" rx="8" fill="#1a1733" stroke="#3a3266"/>
    <rect x="18" y="14" width="214" height="44" rx="6" fill="#221d42" stroke="#4a3f85"/>
    <rect x="34" y="26" width="182" height="20" rx="4" fill="#2a2450" stroke="#5b4fa3"/>
    <rect x="196" y="44" width="18" height="18" rx="3" fill="url(#seal)"/>
    <text x="125" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#8d81c4" text-anchor="middle">KEK wraps DEK</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
    <text x="360" y="160" fill="#6f65a8">checks</text>
    <text x="360" y="184" font-family="Consolas, Menlo, monospace" font-size="13" fill="#cfc8f2">validate | blast | rotation</text>
    <text x="360" y="214" fill="#6f65a8">cycle safe</text>
    <text x="360" y="238" font-family="Consolas, Menlo, monospace" font-size="13" fill="#cfc8f2">depth first, reported once</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
    <text x="700" y="160" fill="#6f65a8">exit codes</text>
    <text x="700" y="184" font-family="Consolas, Menlo, monospace" font-size="13" fill="#cfc8f2">0 clean | 1 findings | 2 error</text>
    <text x="700" y="214" fill="#6f65a8">as-of</text>
    <text x="700" y="238" font-family="Consolas, Menlo, monospace" font-size="13" fill="#cfc8f2">required for rotation</text>
  </g>
</svg>

