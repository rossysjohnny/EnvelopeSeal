[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envelopeseal"
version = "1.0.0"
description = "Offline auditor for an envelope encryption key hierarchy."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "the envelopeseal authors" }]
keywords = ["envelope-encryption", "kek", "dek", "key-wrapping", "audit"]

[project.scripts]
envelopeseal = "envelopeseal.cli:main"

[tool.setuptools]
